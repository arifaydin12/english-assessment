<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Placement Test (CEFR A1–C2)</title>
  <meta name="description" content="A free adaptive English placement test. Answer 30 questions and get an estimated CEFR level from A1 to C2, with a detailed review. Runs entirely in your browser.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f6fb">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233347d6'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='white'%3EEN%3C/text%3E%3C/svg%3E">
  <!-- Apply the saved theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('ea2:theme'));
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
      } catch (e) { /* storage blocked: keep the default theme */ }
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <a class="brand" href="./" aria-label="English Placement Test, home">
      <span class="brand-mark" aria-hidden="true">EN</span>
      <span class="brand-name">English Placement Test</span>
    </a>
    <button id="theme-toggle" class="icon-btn" type="button" aria-pressed="false" aria-label="Dark theme" title="Toggle dark theme">
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main id="main" tabindex="-1">
    <div id="app">
      <noscript><p class="card">This placement test needs JavaScript. Please enable it and reload the page.</p></noscript>
    </div>
  </main>

  <div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <footer class="site-footer">
    <p>Open-source CEFR placement test · questions are original · results stay in your browser.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
